name: Bump Version

# Step 1 of the release flow. Pick a bump type and this opens a pull request
# whose only change is VERSION — the next version is derived from the VERSION
# file on main, so no version number is typed in. Merging that pull request
# fires .github/workflows/release.yml, which builds and publishes the binaries
# and image, pushes the v<version> tag and creates the GitHub Release.
#
# Nothing here pushes to main: the bump reaches main by merging the pull request.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

# Two concurrent bumps would read the same VERSION and produce disagreeing
# branches, so let them queue instead of racing.
concurrency:
  group: bump-version
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0 # tags are needed to reject an already-released version

      # Only VERSION changes here, and there is deliberately no build: the
      # binaries are built in Release, on the commit that lands on main.
      - name: Compute the next version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          current="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$current" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid version in VERSION: $current"
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          prerelease="${BASH_REMATCH[4]}"

          case "$BUMP" in
            major) next="$((10#$major + 1)).0.0" ;;
            minor) next="${major}.$((10#$minor + 1)).0" ;;
            patch)
              # Promoting 1.4.0-beta.1 with a patch bump yields 1.4.0, not 1.4.1.
              if [ -n "$prerelease" ]; then
                next="${major}.${minor}.${patch}"
              else
                next="${major}.${minor}.$((10#$patch + 1))"
              fi
              ;;
            *) echo "::error::Unknown bump type: $BUMP"; exit 1 ;;
          esac

          if git rev-parse -q --verify "refs/tags/v${next}" >/dev/null; then
            echo "::error::Tag v${next} already exists — nothing to bump"
            exit 1
          fi

          printf '%s\n' "$next" > VERSION
          echo "Bumping ${current} -> ${next}"
          echo "VERSION=${next}" >> "$GITHUB_ENV"
          echo "BUMP_TYPE=${BUMP}" >> "$GITHUB_ENV"

      - name: Push the release branch and open the pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          branch="release/v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$branch"
          git add VERSION
          git commit -m "chore: release v${VERSION}"

          # Forced on purpose: re-running for the same version refreshes the
          # branch instead of failing. This scratch branch never targets main.
          git push --force origin "HEAD:refs/heads/$branch"

          state="$(gh pr view "$branch" --json state --jq .state 2>/dev/null || true)"
          if [ "$state" = "OPEN" ]; then
            echo "A release PR for $branch is already open — it now carries the new commit."
            exit 0
          fi

          body=$(printf '%s\n' \
            "Bumps \`VERSION\` to **v${VERSION}** (bump type: \`${BUMP_TYPE}\`)." \
            "" \
            "Merging this pull request triggers \`.github/workflows/release.yml\`, which builds and publishes the binaries and image, pushes the \`v${VERSION}\` tag and creates the GitHub Release." \
            "" \
            "Only the version file changes here — the code was reviewed in the pull requests that introduced it.")

          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: release v${VERSION}" \
            --body "$body"
